name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🏗️ Building the application..."
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Installing Salesforce CLI
        run: |
          #Insatlling Node.js to install Salesforce CLI
          npm install @salesforce/cli --global
          #Verifying Salesforce CLI version
          sf --version
      - name : Decrypting the JWT encrypted key for Authentication
        run: |
          #Decrypting the JWT encrypted key using OpenSSL
          openssl enc -aes-256-cbc -d -in ${{secrets.JWT_ENCRYPTION_KEY_FILE}} -out ${{secrets.JWT_KEY_FILE}} -K ${{secrets.ENCRYTION_KEY}} -iv ${{secrets.ENCRYPTION_IV}} -base64
      


    