name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: 
 # push:
  #  branches:
   #   - feature/**
    #paths:
     # - 'force-app/**'
  pull_request:
    branches:
      - main
      - master 
      - uat
      - sit
      - development
    paths:
    - 'force-app/**'
    types:
      - opened
      - synchronize
      - reopened
      - closed
jobs:
  Build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "🏗️ Building the application..."
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Installing Salesforce CLI
        run: |
          #Insatlling Node.js to install Salesforce CLI
          npm install @salesforce/cli --global
          #Verifying Salesforce CLI version
          sf --version
      - name : Decrypting the JWT encrypted key for Authentication
        run: |
          #Decrypting the JWT encrypted key using OpenSSL.
          openssl enc -aes-256-cbc -d -in ${{secrets.JWT_ENCRYPTION_KEY_FILE}} -out ${{secrets.JWT_KEY_FILE}} -K ${{secrets.ENCRYTION_KEY}} -iv 27D4CE831FCBCAD699476CFFFBD141CA -base64
      - name: Authenticating to Salesforce using JWT
        run:
          #Authenticating to Salesforce using the decrypted JWT key
          sf org login jwt --client-id ${{secrets.SF_CLIENT_ID}} --jwt-key-file ${{secrets.JWT_KEY_FILE}} --username ${{secrets.SF_USERNAME}} --instance-url ${{vars.SF_INSTANCE_URL}} --alias ${{vars.SF_ALIAS}} --set-default
      - name: Validating to Salesforce organization
        run: |
          #Validating the Salesforce organization by displaying the authenticated user
          sf project deploy start --target-org ${{vars.SF_ALIAS}} --source-dir force-app --dry-run --wait 10
      - name: Deploying to Salesforce organization
        run: |
          #Deploying to Salesforce organization
          sf project deploy start --target-org ${{vars.SF_ALIAS}} --source-dir force-app --ignore-conflicts --wait 10
         
